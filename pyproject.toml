[project]
name = "hookrelay-backend"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Eduardo Paludo", email = "eduardo.paludo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
hookrelay-backend = "hookrelay_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # erros de estilo (pycodestyle)
    "F",   # pyflakes (variáveis/imports)
    "I",   # ordenação de imports (isort)
    "B",   # bugbear (padrões perigosos)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
